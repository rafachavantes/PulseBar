name: Release Windows App

# Builds the Tauri desktop shell's own NSIS/WiX bundle — the same one
# produced by `tauri build` locally — and uploads it to a GitHub Release.
# This intentionally does not use Inno Setup: every published PulseBar
# release so far shipped Tauri's native bundler output
# (PulseBar.Desktop_<version>_x64-setup.exe), and Tauri's
# `webviewInstallMode: downloadBootstrapper` already handles the WebView2
# runtime at install time, so no separate bootstrapper packaging is needed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v0.39.0). Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Failed to determine app version from rust/Cargo.toml" >&2
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Determine release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          if [[ -n "$TAG" ]]; then
            echo "Will upload assets to release $TAG"
          else
            echo "No tag provided; building without publishing (workflow_dispatch dry run)"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        shell: bash
        run: pnpm --dir apps/desktop-tauri install --frozen-lockfile

      - name: Build Tauri bundle (NSIS + MSI)
        shell: bash
        run: pnpm --dir apps/desktop-tauri exec tauri build

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetDir = "release-assets"
          New-Item -ItemType Directory -Force $assetDir | Out-Null

          $bundleRoot = "target\release\bundle"
          $installers = @()
          $installers += Get-ChildItem -Path (Join-Path $bundleRoot "nsis") -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          $installers += Get-ChildItem -Path (Join-Path $bundleRoot "msi") -Filter "*.msi" -ErrorAction SilentlyContinue

          if ($installers.Count -eq 0) {
            throw "No NSIS or MSI installer found under $bundleRoot. Check that tauri.conf.json bundle.targets includes nsis/msi."
          }

          foreach ($installer in $installers) {
            $destPath = Join-Path $assetDir $installer.Name
            Copy-Item $installer.FullName $destPath -Force
            $hash = (Get-FileHash -Algorithm SHA256 $destPath).Hash.ToLower()
            "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$destPath.sha256"
          }

          Get-ChildItem $assetDir | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload release assets
        if: env.RELEASE_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          shopt -s nullglob
          assets=(release-assets/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets to upload" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Upload workflow artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v6
        with:
          name: pulsebar-windows-release-assets
          path: release-assets/
